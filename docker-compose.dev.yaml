services:
  backend:
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    ports:
      - "1234:1234"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      MONGO_DB_URL: mongodb://user:password@mongo:27017
      REDIS_HOST: redis
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      TENANT_ID: ${TENANT_ID}
      LOAD_MOCK_DATA: ${LOAD_MOCK_DATA}
      GROUP_ID: ${GROUP_ID}
      FILE_ID: ${FILE_ID}
      DELETION_FILE_ID: ${DELETION_FILE_ID}
      SHEET_NAME: ${SHEET_NAME}
      FOLDER_ID: ${FOLDER_ID}
    depends_on:
      - mongo
      - redis
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - mongo
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
  redis:
    image: redis:8

volumes:
  mongo_data:
