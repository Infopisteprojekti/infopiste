apiVersion: apps/v1
kind: Deployment
metadata:
  name: infopiste-redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infopiste-redis
  template:
    metadata:
      labels:
        app: infopiste-redis
    spec:
      containers:
        - name: infopiste-redis
          image: redis
          imagePullPolicy: Always
          ports:
            - containerPort: 6379
          volumeMounts:
            - mountPath: /data
              name: infopiste-redis-volume
      volumes:
        - name: infopiste-redis-volume
          persistentVolumeClaim:
            claimName: infopiste-redis-claim            

---

apiVersion: v1
kind: Service
metadata:
  name: infopiste-redis-service
spec:
  selector:
    app: infopiste-redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379
  type: ClusterIP
