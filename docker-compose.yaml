services:
  backend:
    container_name: infopiste-backend
    image: ohtuinfopiste/infopiste-backend:staging
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "1234:8080"
    environment:
      MONGO_DB_URL: mongodb://user:password@mongo:27017
      REDIS_HOST: redis
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      TENANT_ID: ${TENANT_ID}
    depends_on:
      - mongo
      - redis
  frontend:
    container_name: infopiste-frontend
    image: ohtuinfopiste/infopiste-frontend:staging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      - backend
  mongo:
    container_name: infopiste-mongo
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
  redis:
    container_name: infopiste-redis
    image: redis:8

volumes:
  mongo_data:
