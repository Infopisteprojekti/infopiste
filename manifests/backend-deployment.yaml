apiVersion: apps/v1
kind: Deployment
metadata:
  name: infopiste-backend-deployment
  namespace: ohtuprojekti-staging
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"infopiste-backend:staging","namespace":"ohtuprojekti-staging"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image","pause":"false"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infopiste-backend
  template:
    metadata:
      labels:
        app: infopiste-backend
    spec:
      containers:
        - name: infopiste-backend
          image: infopiste-backend:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 1234
          env:
            - name: REDIS_HOST
              value: infopiste-redis-service
            - name: MONGO_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: MONGO_DB_URL
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: TENANT_ID
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: CLIENT_SECRET
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"
            requests:
              memory: "128Mi"
              cpu: "100m"

---

apiVersion: v1
kind: Service
metadata:
  name: infopiste-backend-service
spec:
  selector:
    app: infopiste-backend
  ports:
    - protocol: TCP
      port: 1234
      targetPort: 1234
  type: ClusterIP
