services:
  backend:
    image: ohtuinfopiste/infopiste-backend:staging
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      - MONGO_DB_URL=mongodb://mongo:27017/info
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - mongo
      - redis
  frontend:
    image: ohtuinfopiste/infopiste-frontend:staging
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:8080"
    environment:
      VITE_API_BASE_URL: https://infopiste-backend-ohtuprojekti-staging.ext.ocp-test-0.k8s.it.helsinki.fi
    depends_on:
      - backend
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  redis:
    image: redis:8
    ports:
      - "6379:6379"

volumes:
  mongo_data:
