apiVersion: apps/v1
kind: Deployment
metadata:
  name: infopiste-backend-deployment
  namespace: ohtuprojekti-staging
  annotations:
    alpha.image.policy.openshift.io/resolve-names: "*"
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"infopiste-backend:staging","namespace":"ohtuprojekti-staging"},"fieldPath":"spec.template.spec.containers[?(@.name==\"backend\")].image","pause":"false"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infopiste-backend
  template:
    metadata:
      labels:
        app: infopiste-backend
    spec:
      containers:
        - name: backend
          image: infopiste-backend:staging
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MONGO_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: MONGO_DB_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: REDIS_URL
            - name: TENANT_ID
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: TENANT_ID
            - name: CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: CLIENT_ID
            - name: CLIENT_SECRET
              valueFrom:
                configMapKeyRef:
                  name: infopiste-config
                  key: CLIENT_SECRET
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "50Mi"
              cpu: "50m"

---

apiVersion: v1
kind: Service
metadata:
  name: infopiste-backend-service
spec:
  selector:
    app: infopiste-backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
