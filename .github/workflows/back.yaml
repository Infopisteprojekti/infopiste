name: Backend tests

on:
  push:
    branches: [main, backend-tests]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm install
      - name: lint
        run: npm lint
      - name: backend tests
        run: npm test
