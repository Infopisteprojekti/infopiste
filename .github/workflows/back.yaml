name: Backend tests

on:
  push:
    branches:
      [main, 32-room-availability-data-is-fetched-to-the-backend-from-o365]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npm install
      - name: lint
        run: npm run lint
      - name: backend tests
        run: npm run test
